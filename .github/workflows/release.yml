name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        target: [x86_64, aarch64]
        include:
          - target: x86_64
            runs_on: ubuntu-latest
          - target: aarch64
            runs_on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs_on }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install PipeWire dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpipewire-0.3-dev libwireplumber-0.4-dev pipewire pkg-config

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.python-version }}-${{ matrix.target }}
        path: dist/*

  test:
    name: test (${{ matrix.target }}, Python ${{ matrix.python-version }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        target: [x86_64, aarch64]
        include:
          - target: x86_64
            runs_on: ubuntu-latest
          - target: aarch64
            runs_on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs_on }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install PipeWire dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpipewire-0.3-dev libwireplumber-0.4-dev pipewire pkg-config

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ matrix.python-version }}-${{ matrix.target }}
        path: dist

    - name: Install package
      run: |
        pip install dist/*.whl

    - name: Install test dependencies
      run: |
        pip install pytest pytest-cov testcontainers

    - name: Run tests
      run: pytest tests/

  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release directory
      run: |
        mkdir -p release_dist
        find artifacts -name "*.tar.gz" -o -name "*.whl" | xargs -I {} cp {} release_dist/
        cd release_dist
        for file in *; do
          sha256sum "$file" > "$file.sha256"
        done

    - name: Generate release notes (git-cliff)
      uses: orhun/git-cliff-action@v4
      id: git-cliff
      with:
        config: cliff.toml
        args: -vv --latest --strip header
      env:
        OUTPUT: "release_notes.md"
        GITHUB_REPO: ${{ github.repository }}

    - name: Create GitHub Release + upload assets
      uses: softprops/action-gh-release@v2
      with:
        body: ${{ steps.git-cliff.outputs.content }}
        files: |
          release_dist/*.tar.gz
          release_dist/*.whl
          release_dist/*.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
