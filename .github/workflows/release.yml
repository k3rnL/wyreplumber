name: CI and release

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wyreplumber-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  WYREPLUMBER_WP_API: "0.5"

jobs:
  source:
    name: Source archive (Trixie, WirePlumber 0.5)
    runs-on: ubuntu-24.04
    container: python:3.12-slim-trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install WirePlumber 0.5 build dependencies
        run: |
          apt-get update
          apt-get install --yes gcc pkg-config libpipewire-0.3-dev libwireplumber-0.5-dev

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release_contract.py version --tag "${GITHUB_REF_NAME}"

      - name: Build and inspect the single source archive
        run: |
          python -m build --sdist
          python -m twine check dist/*
          python scripts/release_contract.py sdist dist/wyreplumber-*.tar.gz

      - name: Record checksum and portable provenance
        run: |
          python scripts/release_contract.py record dist/wyreplumber-*.tar.gz \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --server-url "${GITHUB_SERVER_URL}" \
            --target source \
            --python-abi source \
            --architecture source

      - name: Upload source artifact without flattening other targets
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/wyreplumber-*.tar.gz*
          if-no-files-found: error

  wheel:
    name: Wheel (${{ matrix.python_abi }}, ${{ matrix.architecture }}, Trixie)
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            python_abi: cp312
            architecture: x86_64
            runner: ubuntu-24.04
          - python: "3.12"
            python_abi: cp312
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - python: "3.13"
            python_abi: cp313
            architecture: x86_64
            runner: ubuntu-24.04
          - python: "3.13"
            python_abi: cp313
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - python: "3.14"
            python_abi: cp314
            architecture: x86_64
            runner: ubuntu-24.04
          - python: "3.14"
            python_abi: cp314
            architecture: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    container: python:${{ matrix.python }}-slim-trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install WirePlumber 0.5 build dependencies
        run: |
          apt-get update
          apt-get install --yes gcc pkg-config libpipewire-0.3-dev libwireplumber-0.5-dev

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release_contract.py version --tag "${GITHUB_REF_NAME}"

      - name: Build and inspect target-qualified wheel
        run: |
          python -m build --wheel
          python -m twine check dist/*
          python scripts/release_contract.py wheel dist/*.whl \
            --python-abi "${{ matrix.python_abi }}" \
            --architecture "${{ matrix.architecture }}"

      - name: Record checksum and portable provenance
        run: |
          python scripts/release_contract.py record dist/*.whl \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --server-url "${GITHUB_SERVER_URL}" \
            --target "${{ matrix.python_abi }}-${{ matrix.architecture }}" \
            --python-abi "${{ matrix.python_abi }}" \
            --architecture "${{ matrix.architecture }}"

      - name: Upload this target without flattening
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.python_abi }}-${{ matrix.architecture }}
          path: dist/*.whl*
          if-no-files-found: error

  wheel-test:
    name: Installed wheel (${{ matrix.python_abi }}, ${{ matrix.architecture }})
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            python_abi: cp312
            architecture: x86_64
            runner: ubuntu-24.04
          - python: "3.12"
            python_abi: cp312
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - python: "3.13"
            python_abi: cp313
            architecture: x86_64
            runner: ubuntu-24.04
          - python: "3.13"
            python_abi: cp313
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - python: "3.14"
            python_abi: cp314
            architecture: x86_64
            runner: ubuntu-24.04
          - python: "3.14"
            python_abi: cp314
            architecture: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    container: python:${{ matrix.python }}-slim-trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install WirePlumber 0.5 runtime and test dependencies
        run: |
          apt-get update
          apt-get install --yes \
            dbus libpipewire-0.3-0 libwireplumber-0.5-0 \
            pipewire pipewire-bin wireplumber
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Download exactly this wheel target
        uses: actions/download-artifact@v4
        with:
          name: release-wheel-${{ matrix.python_abi }}-${{ matrix.architecture }}
          path: dist

      - name: Verify record and install only the built wheel
        run: |
          python scripts/release_contract.py verify-record dist/*.whl
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python scripts/release_contract.py installed \
            --python-abi "${{ matrix.python_abi }}" \
            --architecture "${{ matrix.architecture }}" \
            --check-linkage

      - name: Check installed runtime against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/release_contract.py installed \
            --python-abi "${{ matrix.python_abi }}" \
            --architecture "${{ matrix.architecture }}" \
            --tag "${GITHUB_REF_NAME}" \
            --check-linkage

      - name: Run complete proxy and orchestration contract suite on WirePlumber 0.5
        env:
          WYREPLUMBER_RELEASE_GATE: "1"
          WYREPLUMBER_SPAWN_PIPEWIRE: "1"
        run: dbus-run-session -- python -m pytest tests/

  release:
    name: Publish verified GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, wheel, wheel-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Recheck tag and package version
        run: python scripts/release_contract.py version --tag "${GITHUB_REF_NAME}"

      - name: Download target-separated artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts

      - name: Reject collisions and collect the exact release matrix
        run: |
          python scripts/release_contract.py collect artifacts release_dist \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Create draft GitHub release with verified bytes
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_dist/*

      - name: Publish only after every verified byte is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
