[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyreplumber"
version = "0.2.0"
description = "Native Python bindings for WirePlumber audio orchestration"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{name = "Daniel Erwan", email = "contact@erwandaniel.fr"}]
license = "MIT"
license-files = [
    "LICENSE"
]
keywords = ["pipewire", "wireplumber", "audio", "video", "multimedia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "setuptools>=75.3.3",
]

[project.urls]
Homepage = "https://github.com/k3rnL/wyreplumber"
Repository = "https://github.com/k3rnL/wyreplumber"
Issues = "https://github.com/k3rnL/wyreplumber/issues"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "setup.cfg" }, { file = "**.c" }, { file = "**.h" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wyreplumber = ["py.typed", "*.pyi"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "testcontainers>=3.7.1",
]
